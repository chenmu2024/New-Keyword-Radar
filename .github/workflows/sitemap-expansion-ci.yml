name: Temporary Sitemap Expansion Validation

on:
  push:
    branches:
      - feat/sitemap-cross-site-130-20261030

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m py_compile src/sitemap_monitor.py src/sitemap_cross_signal.py src/publish_sitemap.py
      - name: Run offline Sitemap tests
        run: python -m unittest discover -s tests -p 'test_sitemap_*.py' -v
      - name: Validate source inventory
        run: |
          python - <<'PY'
          import json
          cfg = json.load(open("config/sitemap_sources.json"))
          ids = [x["id"] for x in cfg["sources"]]
          assert len(ids) == 135
          assert len(ids) == len(set(ids))
          assert cfg["trial_end_exclusive"] == "2026-11-02"
          print("Sitemap feeds:", len(ids))
          PY
