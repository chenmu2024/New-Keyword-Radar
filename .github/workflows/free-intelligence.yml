name: Free Search Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/free_search.py"
      - "src/free_intelligence.py"
      - "config/free_intelligence.json"
      - ".github/workflows/free-intelligence.yml"
  schedule:
    # 06:40 Asia/Shanghai, before the existing Trends report window.
    - cron: "40 22 * * *"

permissions:
  contents: write

concurrency:
  group: free-intelligence-report
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run free discovery (no paid API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/free_intelligence.py --max-queries 4 --limit 4
      - name: Persist only the report
        run: |
          git config user.name "free-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/free-intelligence reports/free-intelligence
          if ! git diff --cached --quiet; then
            git commit -m "data: daily free search intelligence"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
