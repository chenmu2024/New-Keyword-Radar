name: Temporary Sitemap Precision Test
on:
  push:
    branches:
      - fix/sitemap-source-precision-20261030
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile updated monitor and signal detector
        run: python -m py_compile src/sitemap_monitor.py src/sitemap_cross_signal.py src/publish_sitemap.py
      - name: Run all offline Sitemap regression tests
        run: python -m unittest discover -s tests -p 'test_sitemap_*.py' -v
      - name: Ensure active pilot date did not change
        run: |
          python - <<'PY'
          import json
          cfg = json.load(open("config/sitemap_sources.json"))
          assert cfg["trial_end_exclusive"] == "2026-11-02"
          assert len(cfg["sources"]) == 135
          print("Config valid, source count:", len(cfg["sources"]))
          PY
