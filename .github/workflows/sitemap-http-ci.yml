name: Temporary HTTP Chunk Regression
on:
  push:
    branches:
      - fix/sitemap-incomplete-read-20261030
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile src/sitemap_monitor.py src/sitemap_cross_signal.py
      - run: python -m unittest discover -s tests -p 'test_sitemap_*.py' -v
