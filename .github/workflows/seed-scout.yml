name: 7-Day Seed Scout

on:
  workflow_dispatch:
  push:
    paths:
      - "src/seed_scout.py"
      - "src/publish_seed_scout.py"
      - "src/opportunity_tracker.py"
      - "tests/test_opportunity_tracker.py"
      - "config/opportunity_reviews.json"
      - "config/discovery_seeds.txt"
      - "config/settings.json"
      - ".github/workflows/seed-scout.yml"
  schedule:
    # Six Beijing-local sweeps: 02:10, 06:10, 10:10, 14:10, 18:10, 22:10.
    # Google Trends often rate-limits a runner after several batches; fresh
    # runners resume only missing roots, giving enough daily capacity for 74/74.
    - cron: "10 2,6,10,14,18,22 * * *"

permissions:
  contents: write

concurrency:
  group: keyword-radar-seed-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Test V3 opportunity ledger
        run: python -m unittest discover -s tests -p "test_opportunity_tracker.py"

      - name: Sweep missing 7-day Rising roots
        env:
          PYTHONUNBUFFERED: "1"
        run: python src/seed_scout.py

      - name: Verify Beijing-local daily coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          local_now = datetime.now(ZoneInfo("Asia/Shanghai"))
          day = local_now.date().isoformat()
          path = Path("data/seed-scout-daily") / f"{day}.json"
          if not path.exists():
              raise SystemExit(f"Missing daily archive: {path}")

          data = json.loads(path.read_text(encoding="utf-8"))
          count = int(data.get("scanned_seed_count", 0) or 0)
          target = int(data.get("target_seed_count", 0) or 0)
          complete = bool(data.get("complete_daily_target", False))
          print(
              f"{day}: scanned_seed_count={count}, target_seed_count={target}, "
              f"complete_daily_target={complete}"
          )

          # Only the final 22:10 local sweep is a hard completeness gate.
          # Earlier sweeps may legitimately leave work for the next fresh runner.
          if local_now.hour >= 22 and not complete:
              raise SystemExit(f"Daily scan incomplete after final sweep: {count}/{target} roots")
          PY

      - name: Publish reconciled scout output
        if: always()
        run: |
          git config user.name "new-keyword-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python src/publish_seed_scout.py
