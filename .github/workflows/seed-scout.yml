name: 7-Day Seed Scout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/seed_scout.py"
      - ".github/workflows/seed-scout.yml"
  schedule:
    # Asia/Shanghai: 02:20, 08:20, 14:20, 20:20.
    # Four batches x 5 roots = 20 roots per local calendar day.
    - cron: "20 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: keyword-radar-pipeline
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Scan 7-day Rising queries
        env:
          PYTHONUNBUFFERED: "1"
        run: python src/seed_scout.py

      - name: Commit scout state and daily archive
        run: |
          git config user.name "new-keyword-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed-scout-latest.json data/seed-scout data/seed-scout-daily reports/seed-scout-daily state/pending.json state/seed_cursor.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh 7-day seed scout $(date -u +%FT%H)"
            git pull --rebase origin main
            git push
          fi
