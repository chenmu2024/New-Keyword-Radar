name: 7-Day Seed Scout

on:
  workflow_dispatch:
  push:
    paths:
      - "src/seed_scout.py"
      - "config/discovery_seeds.txt"
      - "config/settings.json"
      - ".github/workflows/seed-scout.yml"
  schedule:
    # Three Beijing-local sweeps: 05:10, 13:10, 21:10.
    # Each sweep processes as many missing roots as possible, so reliability no
    # longer depends on GitHub firing 15+ separate cron events.
    - cron: "10 5,13,21 * * *"

permissions:
  contents: write

concurrency:
  group: keyword-radar-seed-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Sweep missing 7-day Rising roots
        env:
          PYTHONUNBUFFERED: "1"
        run: python src/seed_scout.py

      - name: Verify Beijing-local daily coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          local_now = datetime.now(ZoneInfo("Asia/Shanghai"))
          day = local_now.date().isoformat()
          path = Path("data/seed-scout-daily") / f"{day}.json"
          if not path.exists():
              raise SystemExit(f"Missing daily archive: {path}")

          data = json.loads(path.read_text(encoding="utf-8"))
          count = int(data.get("scanned_seed_count", 0) or 0)
          target = int(data.get("target_seed_count", 0) or 0)
          complete = bool(data.get("complete_daily_target", False))
          print(
              f"{day}: scanned_seed_count={count}, target_seed_count={target}, "
              f"complete_daily_target={complete}"
          )

          # Only the final 21:10 local sweep is a hard completeness gate.
          # Earlier sweeps may legitimately leave work for the next fresh runner.
          if local_now.hour >= 21 and not complete:
              raise SystemExit(f"Daily scan incomplete after final sweep: {count}/{target} roots")
          PY

      - name: Commit scout state and daily archive
        if: always()
        shell: bash
        run: |
          git config user.name "new-keyword-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed-scout-latest.json data/seed-scout data/seed-scout-daily reports/seed-scout-daily state/pending.json state/seed_cursor.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh full daily seed scout $(date -u +%FT%H)"
            git pull --rebase origin main
            git push
          fi
