name: Free Search Unit Tests

on:
  pull_request:
    paths:
      - "src/free_search.py"
      - "src/free_intelligence.py"
      - "tests/test_pain_query_plan.py"
      - "src/lead_quality.py"
      - "tests/test_lead_quality.py"
      - "tests/test_free_search.py"
      - "config/free_intelligence.json"
      - ".github/workflows/free-intelligence-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p "test_free_search.py" -v
      - run: python -m unittest discover -s tests -p "test_lead_quality.py" -v
      - run: python -m unittest discover -s tests -p "test_pain_query_plan.py" -v
      - run: python -m py_compile src/free_search.py src/free_intelligence.py src/lead_quality.py
